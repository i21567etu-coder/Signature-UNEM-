<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التوقيع - الاتحاد الوطني</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }

        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 500px;
            text-align: center;
            margin-top: 50px;
        }

        .site-logo { 
            width: 100px; 
            margin-bottom: 20px; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        
        h1 { color: #006400; font-size: 24px; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 30px; font-size: 15px; line-height: 1.6; }
        
        .upload-btn {
            background: linear-gradient(135deg, #006400, #004d00);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 100, 0, 0.3);
            width: 100%;
            box-sizing: border-box;
        }
        .upload-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(0, 100, 0, 0.4);
        }
        
        #fileInput { display: none; }
        
        #downloads-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
            width: 100%;
        }

        .download-btn {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
            padding: 15px 20px;
            text-decoration: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
            display: block;
        }
        .download-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
        }

        .status { margin-top: 20px; font-weight: bold; font-size: 14px; min-height: 20px; }
        .loading { color: #f57c00; }
        .success { color: #006400; }
        .error { color: #d32f2f; }

        footer {
            width: 100%;
            background-color: #1a1a1a;
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
            border-top: 3px solid #006400;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.1);
        }

        .footer-text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
        }

        .dev-name {
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            margin-right: 5px;
            text-shadow: 0 0 5px #fff, 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            animation: neon-pulse 2s infinite alternate;
        }

        @keyframes neon-pulse {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #00ffcc; }
            100% { text-shadow: 0 0 2px #fff, 0 0 5px #00ffcc; opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" class="site-logo" alt="شعار الاتحاد" onerror="this.style.display='none'">
        <h1>توقيع المستندات إلكترونياً</h1>
        <p>يدعم ملفات PDF والصور (JPG, PNG).<br>يمكنك اختيار ملف واحد أو <b>عدة ملفات في نفس الوقت</b>.</p>

        <!-- تمت إضافة خاصية multiple هنا لتمكين اختيار عدة ملفات -->
        <label for="fileInput" class="upload-btn">
            <span>📂</span>
            <span>اضغط هنا لاختيار ملف أو أكثر</span>
        </label>
        <input type="file" id="fileInput" accept="application/pdf, image/png, image/jpeg, image/jpg" multiple onchange="processFiles()">

        <div id="status-msg" class="status"></div>

        <!-- حاوية الروابط لملفات متعددة -->
        <div id="downloads-container"></div>
    </div>

    <footer>
        <div class="footer-text">
            Développé par <span class="dev-name">Mohamed Dah Agove</span>
        </div>
    </footer>

    <script>
        const MAX_SIZE_BYTES = 10 * 1024 * 1024; // 10MB - الحد الأقصى المطلوب لحجم أي ملف
        const SAFE_TARGET_BYTES = MAX_SIZE_BYTES * 0.92; // هامش أمان بسيط تحت 10MB

        // ---------------------------------------------------------------
        // 1) ضغط الصور الكبيرة (10MB فأكثر) لتصبح أصغر من 10MB دون إفساد جودتها
        //    يعمل فقط على الملفات التي تتجاوز الحجم المسموح، ولا يلمس الملفات الأصغر إطلاقاً
        // ---------------------------------------------------------------
        async function compressImageIfNeeded(file) {
            if (file.size < MAX_SIZE_BYTES) {
                // الملف بالفعل أصغر من 10MB: يُستخدم كما هو دون أي تعديل على جودته
                return { bytes: new Uint8Array(await file.arrayBuffer()), isPng: file.type === 'image/png' };
            }

            const bitmap = await createImageBitmap(file);
            let scale = 1;
            let quality = 0.92;
            let finalBlob = null;

            // نحاول أولاً تقليل الجودة تدريجياً، وإن لم يكفِ نقلل الأبعاد قليلاً، بشكل متكرر
            // حتى نصل لحجم أصغر من 10MB مع الحفاظ على أفضل جودة ممكنة
            for (let attempt = 0; attempt < 14; attempt++) {
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(bitmap.width * scale));
                canvas.height = Math.max(1, Math.round(bitmap.height * scale));
                const ctx = canvas.getContext('2d');
                ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                finalBlob = blob;

                if (blob.size < SAFE_TARGET_BYTES) break;

                if (quality > 0.5) {
                    quality -= 0.08; // نقلل الجودة أولاً (أقل ضرراً على الشكل العام)
                } else {
                    scale *= 0.85;   // إن لم تعد الجودة كافية، نقلل الأبعاد تدريجياً
                    quality = 0.75;
                }
            }

            return { bytes: new Uint8Array(await finalBlob.arrayBuffer()), isPng: false };
        }

        // ---------------------------------------------------------------
        // 2) تجهيز الشعار كختم واضح لا يغطي الكتابة:
        //    نزيل الخلفية البيضاء لشعار U.N.E.M ونجعلها شفافة تماماً، ونضبط شفافية
        //    خطوط الشعار نفسه بحيث يظهر بوضوح كعلامة مائية حقيقية دون حجب النص تحته
        // ---------------------------------------------------------------
        async function prepareWatermarkLogo(logoArrayBuffer) {
            const bitmap = await createImageBitmap(new Blob([logoArrayBuffer], { type: 'image/png' }));
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const WHITE_THRESHOLD = 235;   // أي بكسل أبيض تقريباً يصبح شفافاً بالكامل (إزالة الخلفية)
            const WATERMARK_ALPHA = 100;   // شفافية خطوط الشعار نفسها (~39%) لتظهر بوضوح دون تغطية النص

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                if (r >= WHITE_THRESHOLD && g >= WHITE_THRESHOLD && b >= WHITE_THRESHOLD) {
                    data[i + 3] = 0; // خلفية بيضاء -> شفافة كلياً
                } else {
                    data[i + 3] = WATERMARK_ALPHA; // رسم الشعار -> شفافية خفيفة تجعله ختماً واضحاً
                }
            }
            ctx.putImageData(imageData, 0, 0);

            const watermarkBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            return new Uint8Array(await watermarkBlob.arrayBuffer());
        }

        async function processFiles() {
            const fileInput = document.getElementById('fileInput');
            const statusMsg = document.getElementById('status-msg');
            const downloadsContainer = document.getElementById('downloads-container');
            const files = fileInput.files;

            if (files.length === 0) return;

            // تصفير حاوية التحميل وإظهار حالة التحميل
            downloadsContainer.innerHTML = '';
            statusMsg.innerText = "⏳ جاري المعالجة وتحويل الملفات...";
            statusMsg.className = "status loading";

            try {
                // 1. جلب الشعار مرة واحدة وتجهيزه كختم شفاف وواضح لاستخدامه مع جميع الملفات
                const logoResponse = await fetch('logo.png');
                if (!logoResponse.ok) throw new Error("لم يتم العثور على logo.png");
                const logoImageBytes = await logoResponse.arrayBuffer();
                const watermarkBytes = await prepareWatermarkLogo(logoImageBytes);
                const { PDFDocument } = PDFLib;

                let hadOversizedPdf = false;

                // 2. المرور على كل ملف ومعالجته
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    let pdfDoc;

                    // التحقق من نوع الملف (صورة أم PDF)
                    if (file.type.startsWith('image/')) {
                        pdfDoc = await PDFDocument.create();

                        // ضغط الصورة تلقائياً إن كان حجمها 10MB أو أكثر (دون المساس بالصور الأصغر)
                        const { bytes: imageBytes, isPng } = await compressImageIfNeeded(file);
                        let embeddedImage;

                        if (isPng) {
                            embeddedImage = await pdfDoc.embedPng(imageBytes);
                        } else {
                            embeddedImage = await pdfDoc.embedJpg(imageBytes);
                        }

                        const page = pdfDoc.addPage([embeddedImage.width, embeddedImage.height]);
                        
                        page.drawImage(embeddedImage, {
                            x: 0,
                            y: 0,
                            width: embeddedImage.width,
                            height: embeddedImage.height,
                        });

                    } else {
                        const pdfBytes = await file.arrayBuffer();
                        if (file.size >= MAX_SIZE_BYTES) hadOversizedPdf = true;
                        pdfDoc = await PDFDocument.load(pdfBytes);
                    }

                    // تحضير صورة الختم (الشعار الشفاف) لهذا المستند
                    const stampImage = await pdfDoc.embedPng(watermarkBytes);

                    // تطبيق الختم
                    const pages = pdfDoc.getPages();
                    for (const page of pages) {
                        const { width, height } = page.getSize();
                        
                        // الختم المائي (الوسط) - الخلفية شفافة والخطوط واضحة، بحيث يبقى النص مقروءاً بالكامل تحته
                        const centerScale = 0.5;
                        const centerDims = stampImage.scale(centerScale);
                        page.drawImage(stampImage, {
                            x: (width - centerDims.width) / 2,
                            y: (height - centerDims.height) / 2,
                            width: centerDims.width,
                            height: centerDims.height,
                        });
                        
                        // ملاحظة: تم إزالة الختم الصغير الجانبي بناءً على طلبك
                    }

                    // الحفظ والتنزيل لكل ملف (useObjectStreams مفعّل افتراضياً لتقليل الحجم قدر الإمكان)
                    const modifiedPdfBytes = await pdfDoc.save({ useObjectStreams: true });
                    const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                    const blobUrl = URL.createObjectURL(blob);

                    const newFileName = file.name.replace(/\.[^/.]+$/, "") + "_signed.pdf";
                    
                    // إنشاء زر تحميل خاص بهذا الملف
                    const downloadLink = document.createElement('a');
                    downloadLink.className = 'download-btn';
                    downloadLink.href = blobUrl;
                    downloadLink.download = newFileName;
                    downloadLink.innerText = `📥 تنزيل: ${newFileName}`;
                    
                    downloadsContainer.appendChild(downloadLink);
                }

                statusMsg.innerText = hadOversizedPdf
                    ? "✅ تم التحويل والتوقيع بنجاح! (تنبيه: بعض ملفات PDF كانت أكبر من 10MB أصلاً، وقد لا يمكن تصغيرها أكثر دون إعادة معالجة محتواها الداخلي)"
                    : "✅ تم التحويل والتوقيع بنجاح!";
                statusMsg.className = "status success";

            } catch (err) {
                console.error(err);
                statusMsg.innerText = "❌ حدث خطأ: " + err.message;
                statusMsg.className = "status error";
            }
        }
    </script>
</body>
</html>
